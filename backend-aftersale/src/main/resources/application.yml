server:
  port: 18085

spring:
  application:
    name: dwkshop-aftersale-service
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop_aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: dwkshop
    password: dwkshop
    publisher-confirm-type: correlated
    publisher-returns: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  internal:
    secret: ${DWKSHOP_INTERNAL_SECRET:dwkshop-local-internal-secret-change-me}
  services:
    order:
      base-url: ${DWKSHOP_ORDER_SERVICE_BASE_URL:http://localhost:18084}
    product:
      base-url: ${DWKSHOP_PRODUCT_SERVICE_BASE_URL:http://localhost:18082}
  mq:
    refund-exchange: dwkshop.refund.exchange
    refund-approved-routing-key: refund.approved
  outbox:
    publish-interval-ms: 1000
