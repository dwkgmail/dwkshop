spring:
  datasource:
    url: jdbc:h2:mem:dwkshop-aftersale;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
