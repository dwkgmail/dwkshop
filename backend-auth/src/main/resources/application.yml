server:
  port: 18081

spring:
  application:
    name: dwkshop-auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  internal:
    secret: ${DWKSHOP_INTERNAL_SECRET:dwkshop-local-internal-secret-change-me}
