server:
  port: 8080

spring:
  application:
    name: dwkshop-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${DWKSHOP_AUTH_SERVICE_URI:http://localhost:18081}
          predicates:
            - Path=/api/auth/**,/admin/auth/**,/admin/operation-logs,/api/health
        - id: product-service
          uri: ${DWKSHOP_PRODUCT_SERVICE_URI:http://localhost:18082}
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/search/products,/admin/products/**
        - id: cart-service
          uri: ${DWKSHOP_CART_SERVICE_URI:http://localhost:18083}
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: ${DWKSHOP_ORDER_SERVICE_URI:http://localhost:18084}
          predicates:
            - Path=/api/orders/**,/admin/orders/**
        - id: aftersale-service
          uri: ${DWKSHOP_AFTERSALE_SERVICE_URI:http://localhost:18085}
          predicates:
            - Path=/api/aftersales/**,/admin/aftersales/**

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"
