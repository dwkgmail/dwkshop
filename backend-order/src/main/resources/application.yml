server:
  port: 18084

spring:
  application:
    name: dwkshop-order-service
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: dwkshop
    password: dwkshop
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  order:
    settlement-ttl-minutes: 30
  services:
    cart:
      base-url: ${DWKSHOP_CART_SERVICE_BASE_URL:http://localhost:18083}
    member:
      base-url: ${DWKSHOP_MEMBER_SERVICE_BASE_URL:http://localhost:18086}
    product:
      base-url: ${DWKSHOP_PRODUCT_SERVICE_BASE_URL:http://localhost:18082}
  mq:
    order-exchange: dwkshop.order.exchange
    order-created-queue: dwkshop.order.created
    order-created-routing-key: order.created
