server:
  port: 18084

spring:
  application:
    name: dwkshop-order-service
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: dwkshop
    password: dwkshop
    publisher-confirm-type: correlated
    publisher-returns: true
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  internal:
    secret: ${DWKSHOP_INTERNAL_SECRET:dwkshop-local-internal-secret-change-me}
  order:
    settlement-ttl-minutes: 30
  services:
    cart:
      base-url: ${DWKSHOP_CART_SERVICE_BASE_URL:http://localhost:18083}
    member:
      base-url: ${DWKSHOP_MEMBER_SERVICE_BASE_URL:http://localhost:18086}
    marketing:
      base-url: ${DWKSHOP_MARKETING_SERVICE_BASE_URL:http://localhost:18087}
    product:
      base-url: ${DWKSHOP_PRODUCT_SERVICE_BASE_URL:http://localhost:18082}
  mq:
    inventory-exchange: dwkshop.inventory.exchange
    refund-exchange: dwkshop.refund.exchange
    refund-approved-routing-key: refund.approved
    refund-approved-order-queue: dwkshop.refund.approved.order
    listener:
      retry:
        max-attempts: ${DWKSHOP_MQ_RETRY_MAX_ATTEMPTS:4}
        initial-interval-ms: ${DWKSHOP_MQ_RETRY_INITIAL_INTERVAL_MS:500}
        multiplier: ${DWKSHOP_MQ_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${DWKSHOP_MQ_RETRY_MAX_INTERVAL_MS:5000}
