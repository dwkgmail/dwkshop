server:
  port: 18084

spring:
  application:
    name: dwkshop-order-service
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: dwkshop
    password: dwkshop
    publisher-confirm-type: correlated
    publisher-returns: true
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  internal:
    secret: ${DWKSHOP_INTERNAL_SECRET:dwkshop-local-internal-secret-change-me}
  order:
    settlement-ttl-minutes: 30
  services:
    cart:
      base-url: ${DWKSHOP_CART_SERVICE_BASE_URL:http://localhost:18083}
    member:
      base-url: ${DWKSHOP_MEMBER_SERVICE_BASE_URL:http://localhost:18086}
    marketing:
      base-url: ${DWKSHOP_MARKETING_SERVICE_BASE_URL:http://localhost:18087}
    product:
      base-url: ${DWKSHOP_PRODUCT_SERVICE_BASE_URL:http://localhost:18082}
  mq:
    inventory-exchange: dwkshop.inventory.exchange
    refund-exchange: dwkshop.refund.exchange
    refund-approved-routing-key: refund.approved
    refund-approved-order-queue: dwkshop.refund.approved.order
