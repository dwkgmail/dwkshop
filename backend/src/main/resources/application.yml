server:
  port: 8080

spring:
  application:
    name: dwkshop-backend
  datasource:
    url: jdbc:mysql://localhost:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: dwkshop
    password: dwkshop
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: ${DWKSHOP_ES_ENABLED:true}
  elasticsearch:
    uris: ${DWKSHOP_ES_URIS:http://localhost:9200}
  rabbitmq:
    host: localhost
    port: 5672
    username: dwkshop
    password: dwkshop
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} level=%-5level app=${spring.application.name} traceId=%X{traceId:-} thread=%thread logger=%logger{36} msg=%msg%n%ex{short}"

dwkshop:
  auth:
    secret: ${DWKSHOP_AUTH_SECRET:dwkshop-local-dev-secret-change-me}
    ttl-seconds: 86400
  internal:
    secret: ${DWKSHOP_INTERNAL_SECRET:dwkshop-local-internal-secret-change-me}
  order:
    settlement-ttl-minutes: 30
  mq:
    order-exchange: dwkshop.order.exchange
    order-created-queue: dwkshop.order.created
    order-created-routing-key: order.created
  search:
    elasticsearch:
      enabled: ${DWKSHOP_ES_ENABLED:true}
      index-name: ${DWKSHOP_ES_PRODUCT_INDEX:dwkshop_products}
