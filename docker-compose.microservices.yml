services:
  mysql:
    extends:
      file: docker-compose.yml
      service: mysql
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq
  elasticsearch:
    extends:
      file: docker-compose.yml
      service: elasticsearch

  gateway:
    build:
      context: ./backend-gateway
    container_name: dwkshop-gateway
    restart: unless-stopped
    environment:
      DWKSHOP_AUTH_SERVICE_URI: http://auth-service:18081
      DWKSHOP_PRODUCT_SERVICE_URI: http://product-service:18082
      DWKSHOP_CART_SERVICE_URI: http://cart-service:18083
      DWKSHOP_ORDER_SERVICE_URI: http://order-service:18084
      DWKSHOP_AFTERSALE_SERVICE_URI: http://aftersale-service:18085
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - aftersale-service

  auth-service:
    build:
      context: .
      dockerfile: backend-auth/Dockerfile
    container_name: dwkshop-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
    depends_on:
      - mysql

  product-service:
    build:
      context: .
      dockerfile: backend-product/Dockerfile
    container_name: dwkshop-product-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18082
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      DWKSHOP_ES_URIS: http://elasticsearch:9200
    depends_on:
      - auth-service
      - elasticsearch

  cart-service:
    build:
      context: .
      dockerfile: backend-cart/Dockerfile
    container_name: dwkshop-cart-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18083
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      DWKSHOP_PRODUCT_SERVICE_BASE_URL: http://product-service:18082
    depends_on:
      - auth-service
      - product-service

  order-service:
    build:
      context: .
      dockerfile: backend-order/Dockerfile
    container_name: dwkshop-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18084
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - auth-service
      - redis
      - rabbitmq

  aftersale-service:
    build:
      context: .
      dockerfile: backend-aftersale/Dockerfile
    container_name: dwkshop-aftersale-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18085
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
    depends_on:
      - auth-service
      - order-service
      - product-service

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
