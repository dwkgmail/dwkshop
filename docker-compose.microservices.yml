services:
  mysql:
    extends:
      file: docker-compose.yml
      service: mysql
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq
  elasticsearch:
    extends:
      file: docker-compose.yml
      service: elasticsearch

  db-migrator:
    build:
      context: .
      dockerfile: backend-migrator/Dockerfile
    container_name: dwkshop-db-migrator
    restart: "no"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    build:
      context: ./backend-gateway
    container_name: dwkshop-gateway
    restart: unless-stopped
    environment:
      DWKSHOP_AUTH_SERVICE_URI: http://auth-service:18081
      DWKSHOP_PRODUCT_SERVICE_URI: http://product-service:18082
      DWKSHOP_CART_SERVICE_URI: http://cart-service:18083
      DWKSHOP_ORDER_SERVICE_URI: http://order-service:18084
      DWKSHOP_AFTERSALE_SERVICE_URI: http://aftersale-service:18085
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      aftersale-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      marketing-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: backend-auth/Dockerfile
    container_name: dwkshop-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  product-service:
    build:
      context: .
      dockerfile: backend-product/Dockerfile
    container_name: dwkshop-product-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18082
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_product?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_RABBITMQ_HOST: rabbitmq
      DWKSHOP_ES_URIS: http://elasticsearch:9200
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18082/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  cart-service:
    build:
      context: .
      dockerfile: backend-cart/Dockerfile
    container_name: dwkshop-cart-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18083
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_cart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      DWKSHOP_PRODUCT_SERVICE_BASE_URL: http://product-service:18082
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18083/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  member-service:
    build:
      context: .
      dockerfile: backend-member/Dockerfile
    container_name: dwkshop-member-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18086
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_member?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18086/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  marketing-service:
    build:
      context: .
      dockerfile: backend-marketing/Dockerfile
    container_name: dwkshop-marketing-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18087
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_marketing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18087/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: backend-order/Dockerfile
    container_name: dwkshop-order-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18084
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      DWKSHOP_CART_SERVICE_BASE_URL: http://cart-service:18083
      DWKSHOP_MARKETING_SERVICE_BASE_URL: http://marketing-service:18087
      DWKSHOP_MEMBER_SERVICE_BASE_URL: http://member-service:18086
      DWKSHOP_PRODUCT_SERVICE_BASE_URL: http://product-service:18082
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      marketing-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18084/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  aftersale-service:
    build:
      context: .
      dockerfile: backend-aftersale/Dockerfile
    container_name: dwkshop-aftersale-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 18085
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dwkshop_aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: dwkshop
      SPRING_DATASOURCE_PASSWORD: dwkshop
      SPRING_RABBITMQ_HOST: rabbitmq
      DWKSHOP_ORDER_SERVICE_BASE_URL: http://order-service:18084
      DWKSHOP_INTERNAL_SECRET: dwkshop-shared-internal-secret
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18085/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
